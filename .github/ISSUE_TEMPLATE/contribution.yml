name: Change proposal
description: Propose a focused change
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/dotkaio/dot/blob/main/CONTRIBUTING.md) before proposing a change.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem should Dot solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Explain why an extension or existing API is insufficient.
    validations:
      required: false
